# Review pull requests from forks (hardened `pull_request_target` template).
#
# Copy to .github/workflows/morning-star-code-review-forks.yml next to the non-fork
# workflow and set the same secrets and variables.
#
# How it stays safe:
# - It never checks out or runs pull request code. The reviewer fetches the PR head
#   into a temporary directory and its agent only has read-only tools (no network,
#   no shell). Everything it posts is sanitised (no links, no mentions).
# - Reviews run automatically only for trusted authors (OWNER, MEMBER, COLLABORATOR)
#   whose PR comes from their own fork (head repository owned by the author): a
#   trusted author's PR from someone else's branch would let that someone push code
#   that is reviewed with your keys. For anything else a maintainer adds the label
#   "msreview: safe-to-review" after reading the change. The review is bound to the
#   head commit at the moment the label is added (expected-head-sha), and the label
#   is removed after the review and on every new push, so each push needs a fresh
#   approval.
# - Check the head commit before you add the label: a push that lands while you read
#   (before the label) is the commit that gets reviewed. Anyone with triage or write
#   access can add labels. See docs/security.md.
# - The workflow token is read-only; the GitHub App token does all writes.
# Residual risks (steerable review text, cost, rate limits): see docs/security.md.
name: Morning Star Code Review (forks)

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review, labeled]

permissions: {}

jobs:
  review:
    if: >-
      github.event.pull_request.head.repo.full_name != github.repository &&
      (
        (github.event.action != 'labeled' &&
         contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'),
                  github.event.pull_request.author_association) &&
         github.event.pull_request.head.repo.owner.login == github.event.pull_request.user.login) ||
        (github.event.action == 'labeled' &&
         github.event.label.name == 'msreview: safe-to-review')
      )
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      pull-requests: read
    # Concurrency groups are shared by every workflow in the repository. A name of its
    # own keeps the non-fork workflow (whose run joins its group even when it skips a
    # fork PR) from cancelling this review.
    concurrency:
      group: morning-star-code-review-forks-${{ github.repository }}-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    steps:
      # Pin to the full commit SHA of the release you reviewed.
      - uses: ThomsenDrake/morning-star-code-reviews@v0.1.0
        with:
          mistral-api-key: ${{ secrets.MISTRAL_API_KEY }}
          client-id: ${{ vars.MSREVIEW_APP_CLIENT_ID }}
          app-private-key: ${{ secrets.MSREVIEW_APP_PRIVATE_KEY }}
          expected-head-sha: ${{ github.event.pull_request.head.sha }}
          remove-label: "msreview: safe-to-review"

  revoke-approval:
    # A new push to a PR that is not reviewed automatically invalidates the approval.
    if: >-
      github.event.action == 'synchronize' &&
      github.event.pull_request.head.repo.full_name != github.repository &&
      (
        !contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'),
                  github.event.pull_request.author_association) ||
        github.event.pull_request.head.repo.owner.login != github.event.pull_request.user.login
      ) &&
      contains(github.event.pull_request.labels.*.name, 'msreview: safe-to-review')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - id: token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.MSREVIEW_APP_CLIENT_ID }}
          private-key: ${{ secrets.MSREVIEW_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-pull-requests: write
      - name: Remove the approval label
        shell: bash
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          if ! out=$(gh api --method DELETE \
              "repos/$REPO/issues/$PR/labels/msreview%3A%20safe-to-review" 2>&1); then
            case "$out" in
              *"HTTP 404"*) echo "The label was already removed." ;;
              *) echo "$out" >&2; exit 1 ;;
            esac
          fi
