name: Morning Star Code Review
description: >-
  Review a pull request with Mistral-hosted models as a Mistral Workflow; post as your
  GitHub App or produce a report.
author: Drake Thomsen
branding:
  icon: eye
  color: orange

inputs:
  mistral-api-key:
    description: Mistral API key of a workspace with Workflows access.
    required: true
  client-id:
    description: GitHub App client ID. Without the App credentials the review is a report.
    required: false
    default: ""
  app-private-key:
    description: >-
      GitHub App private key (PEM). Used only by the two token steps: a read-only token
      for the review, and a write token minted after it for posting.
    required: false
    default: ""
  post:
    description: "auto | never (never = report only)."
    required: false
    default: auto
  preset:
    description: >-
      best | balanced | single | fast | mistral. Empty = the repository file's preset,
      else the built-in default (best: three explorers, merged, then verified).
    required: false
    default: ""
  explorers:
    description: Comma-separated explorer models for an ensemble (overrides the preset).
    required: false
    default: ""
  explorer-model:
    description: A single explorer model (no ensemble).
    required: false
    default: ""
  formatter-model:
    description: Formatter model (only used when the explorer's notes cannot be parsed).
    required: false
    default: ""
  explorer-effort:
    description: "default | low | medium | high | max (validated per model)."
    required: false
    default: ""
  verify:
    description: "true | false: run the verifier on merged candidates. Empty = preset."
    required: false
    default: ""
  verifier-model:
    description: Verifier model. Empty = preset.
    required: false
    default: ""
  verifier-effort:
    description: "default | low | medium | high | max. Empty = preset."
    required: false
    default: ""
  max-cost-usd:
    description: Per-run cost limit in USD. Empty = 10.00 (or a lower repository value).
    required: false
    default: ""
  max-tool-calls:
    description: Tool calls per explorer, used as set. Empty = 60 (25 for a flash model outside the best preset).
    required: false
    default: ""
  explorer-minutes:
    description: Minutes per explorer. Empty = 15.
    required: false
    default: ""
  verifier-max-tool-calls:
    description: Tool calls for the verifier, used as set. Empty = 30 (25 for a flash model).
    required: false
    default: ""
  verifier-minutes:
    description: Minutes for the verifier. Empty = 8.
    required: false
    default: ""
  allowed-models:
    description: Comma-separated models the run may use.
    required: false
    default: "zai-glm-5-3,mistral-large-4,zai-glm-5-3-flash,deepseek-v4-1-flash-1017"
  review-drafts:
    description: "true | false: review draft pull requests."
    required: false
    default: "false"
  labels:
    description: >-
      true | false: keep one status label on the PR (msreview: ready to merge /
      findings / incomplete). Needs Issues: write on the App.
    required: false
    default: "true"
  suggestions:
    description: "true | false: add validated suggestion blocks to inline comments."
    required: false
    default: "true"
  fail-on:
    description: "never | findings | high | critical: fail the step at this threshold."
    required: false
    default: never
  deadline-minutes:
    description: >-
      Overall time limit in minutes (20-300). The run winds down 15 minutes before it and
      still posts. Keep timeout-minutes about 20 above it.
    required: false
    default: "90"
  telemetry:
    description: "true | false: enable Workflows / Agents SDK telemetry."
    required: false
    default: "false"
  pr-url:
    description: >-
      Pull request URL. Empty = the triggering pull request (or, on issue_comment, the
      pull request commented on).
    required: false
    default: ""
  expected-head-sha:
    description: >-
      Review only this head commit (skip if the PR moved). Empty = the event's head SHA.
    required: false
    default: ""
  remove-label:
    description: >-
      A label to remove from the PR after the run (the fork template passes
      "msreview: safe-to-review", so every new push needs a fresh approval).
    required: false
    default: ""

outputs:
  status:
    description: "posted | report | skipped | superseded | failed"
    value: ${{ steps.publish.outputs.status || steps.review.outputs.status }}
  verdict:
    description: "clean | findings | incomplete"
    value: ${{ steps.publish.outputs.verdict || steps.review.outputs.verdict }}
  ready:
    description: >-
      true | false: ready to merge (a complete review, and no open finding at or above
      the blocking severity). Empty when no review was produced.
    value: ${{ steps.publish.outputs.ready || steps.review.outputs.ready }}
  findings:
    description: Number of open findings (possible issues, which the verifier could not confirm, do not count).
    value: ${{ steps.publish.outputs.findings || steps.review.outputs.findings }}
  execution-id:
    description: The Mistral Workflows execution id.
    value: ${{ steps.publish.outputs.execution-id || steps.review.outputs.execution-id }}
  report-path:
    description: Path of report.md on the runner.
    value: ${{ steps.publish.outputs.report-path || steps.review.outputs.report-path }}

runs:
  using: composite
  steps:
    # A read-only token for the review. App installation tokens expire after one hour
    # and a review slowed down by model rate limits can take longer, so the token that
    # posts is minted after the review (token-write).
    - id: token-read
      if: ${{ inputs.client-id != '' && inputs.app-private-key != '' && inputs.post != 'never' }}
      continue-on-error: true
      uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
      with:
        client-id: ${{ inputs.client-id }}
        private-key: ${{ inputs.app-private-key }}
        owner: ${{ github.repository_owner }}
        repositories: ${{ github.event.repository.name }}
        permission-contents: read
        permission-pull-requests: read
        permission-issues: ${{ inputs.labels == 'true' && 'read' || '' }}

    - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      with:
        python-version: "3.12"
        enable-cache: auto
        cache-dependency-glob: ${{ github.action_path }}/uv.lock
        # Look for uv settings in this action, not in the caller's workspace (which is
        # usually empty: the workflow needs no checkout).
        working-directory: ${{ github.action_path }}

    - name: Install morning-star-code-reviews (two environments, one lock)
      shell: bash
      env:
        UV_NO_CONFIG: "1"
      run: |
        set -euo pipefail
        unset UV_INDEX_URL UV_DEFAULT_INDEX UV_EXTRA_INDEX_URL UV_INDEX_STRATEGY PIP_INDEX_URL
        UV_PROJECT_ENVIRONMENT="$RUNNER_TEMP/msreview/venv-worker" \
          uv sync --project "$GITHUB_ACTION_PATH" --frozen --no-dev --no-editable
        UV_PROJECT_ENVIRONMENT="$RUNNER_TEMP/msreview/venv-agent" \
          uv sync --project "$GITHUB_ACTION_PATH" --frozen --no-dev --no-editable --extra agent

    - id: review
      shell: bash
      env:
        MISTRAL_API_KEY: ${{ inputs.mistral-api-key }}
        MSREVIEW_GITHUB_TOKEN: ${{ steps.token-read.outputs.token }}
        MSREVIEW_APP_SLUG: ${{ steps.token-read.outputs.app-slug }}
        MSREVIEW_TOKEN_STEP: ${{ steps.token-read.outcome || 'skipped' }}
        # With App credentials the review writes a publish plan; the publish step posts it.
        MSREVIEW_DEFER_PUBLISH_DIR: >-
          ${{ steps.token-read.conclusion == 'success' &&
          format('{0}/msreview/publish', runner.temp) || '' }}
        MSREVIEW_READ_TOKEN: ${{ github.token }}
        MSREVIEW_AGENT_PYTHON: ${{ runner.temp }}/msreview/venv-agent/bin/python
        MSREVIEW_REPORT_DIR: ${{ runner.temp }}/msreview/report
        MSREVIEW_RUN_ROOT: ${{ runner.temp }}/msreview/runs
        MSREVIEW_PR_URL: >-
          ${{ inputs.pr-url || github.event.pull_request.html_url ||
          github.event.issue.pull_request.html_url }}
        # A `/msreview` command comment: re-apply the commands, never run a model.
        MSREVIEW_REFRESH: ${{ github.event_name == 'issue_comment' }}
        # The event's head SHA only binds the run when the run reviews the event's PR.
        MSREVIEW_HEAD_SHA: >-
          ${{ inputs.expected-head-sha || ((inputs.pr-url == '' ||
          inputs.pr-url == github.event.pull_request.html_url) &&
          github.event.pull_request.head.sha) || '' }}
        MSREVIEW_RUN_LABEL: gha:${{ github.repository }}/${{ github.run_id }}/${{ github.run_attempt }}
        MSREVIEW_POST: ${{ inputs.post }}
        MSREVIEW_PRESET: ${{ inputs.preset }}
        MSREVIEW_EXPLORERS: ${{ inputs.explorers }}
        MSREVIEW_EXPLORER_MODEL: ${{ inputs.explorer-model }}
        MSREVIEW_FORMATTER_MODEL: ${{ inputs.formatter-model }}
        MSREVIEW_EXPLORER_EFFORT: ${{ inputs.explorer-effort }}
        MSREVIEW_VERIFY: ${{ inputs.verify }}
        MSREVIEW_VERIFIER_MODEL: ${{ inputs.verifier-model }}
        MSREVIEW_VERIFIER_EFFORT: ${{ inputs.verifier-effort }}
        MSREVIEW_MAX_COST_USD: ${{ inputs.max-cost-usd }}
        MSREVIEW_MAX_TOOL_CALLS: ${{ inputs.max-tool-calls }}
        MSREVIEW_EXPLORER_MINUTES: ${{ inputs.explorer-minutes }}
        MSREVIEW_VERIFIER_MAX_TOOL_CALLS: ${{ inputs.verifier-max-tool-calls }}
        MSREVIEW_VERIFIER_MINUTES: ${{ inputs.verifier-minutes }}
        MSREVIEW_ALLOWED_MODELS: ${{ inputs.allowed-models }}
        MSREVIEW_REVIEW_DRAFTS: ${{ inputs.review-drafts }}
        MSREVIEW_LABELS: ${{ inputs.labels }}
        MSREVIEW_SUGGESTIONS: ${{ inputs.suggestions }}
        MSREVIEW_FAIL_ON: ${{ inputs.fail-on }}
        MSREVIEW_DEADLINE_MINUTES: ${{ inputs.deadline-minutes }}
        MSREVIEW_TELEMETRY: ${{ inputs.telemetry }}
        MSREVIEW_REMOVE_LABEL: ${{ inputs.remove-label }}
      run: |
        "$RUNNER_TEMP/msreview/venv-worker/bin/msreview" ci &
        pid=$!
        # Actions signals only this shell; pass SIGTERM on so the driver can terminate
        # its execution and stop its worker.
        trap 'kill -TERM "$pid" 2>/dev/null || true' INT TERM
        set +e
        wait "$pid"; rc=$?
        while kill -0 "$pid" 2>/dev/null; do wait "$pid"; rc=$?; done
        exit $rc

    # Runs after a failed or cancelled review too: it posts the failure banner of a
    # failure plan, and removes the fork approval label after every attempt.
    - id: token-write
      if: ${{ always() && inputs.client-id != '' && inputs.app-private-key != '' && inputs.post != 'never' }}
      continue-on-error: true
      uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
      with:
        client-id: ${{ inputs.client-id }}
        private-key: ${{ inputs.app-private-key }}
        owner: ${{ github.repository_owner }}
        repositories: ${{ github.event.repository.name }}
        permission-contents: read
        permission-pull-requests: write
        permission-issues: ${{ inputs.labels == 'true' && 'write' || '' }}

    - id: publish
      if: ${{ always() && inputs.client-id != '' && inputs.app-private-key != '' && inputs.post != 'never' }}
      shell: bash
      env:
        MSREVIEW_GITHUB_TOKEN: ${{ steps.token-write.outputs.token }}
        MSREVIEW_APP_SLUG: ${{ steps.token-write.outputs.app-slug }}
        MSREVIEW_TOKEN_STEP: ${{ steps.token-write.outcome || 'skipped' }}
        MSREVIEW_PUBLISH_PLAN: ${{ steps.review.outputs.publish-plan }}
        MSREVIEW_FAIL_ON: ${{ inputs.fail-on }}
        MSREVIEW_REMOVE_LABEL: ${{ inputs.remove-label }}
        MSREVIEW_PR_URL: >-
          ${{ inputs.pr-url || github.event.pull_request.html_url ||
          github.event.issue.pull_request.html_url }}
        MSREVIEW_REPORT_DIR: ${{ runner.temp }}/msreview/report
      run: |
        msreview="$RUNNER_TEMP/msreview/venv-worker/bin/msreview"
        if [ ! -x "$msreview" ]; then
          echo "msreview is not installed (an earlier step failed); nothing to publish."
          exit 0
        fi
        exec "$msreview" ci-publish

    - if: ${{ always() }}
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: msreview-${{ github.run_id }}-${{ github.run_attempt }}
        path: ${{ runner.temp }}/msreview/report
        if-no-files-found: ignore
        retention-days: 14
