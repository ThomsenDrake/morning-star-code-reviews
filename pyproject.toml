[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "morning-star-code-reviews"
dynamic = ["version"]
description = "GitHub pull-request reviewer that runs as a Mistral Workflow with Mistral-hosted models."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.12,<3.15"
authors = [{ name = "Drake Thomsen" }]
keywords = ["code-review", "github", "pull-request", "mistral", "workflows"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development :: Quality Assurance",
  "Typing :: Typed",
]
# Worker environment. Never add mistralai-workflows extras here ([all], [mistralai],
# [compression], [all-plugins]): they pull the Mistral plugin into the worker venv.
dependencies = [
  "mistralai==3.7.0",
  "mistralai-workflows==3.19.0",
  "httpx>=0.28,<1",
  "pydantic>=2.12,<3",
  "pyjwt[crypto]>=2.15,<3",
  "pyyaml>=6,<7",
]

[project.optional-dependencies]
# Agent environment only. Pulls mistralai-vibe-harness (Proprietary) and
# mistralai-vibe-sdk (no license metadata) from PyPI; see NOTICE.
agent = ["mistralai-agents==1.1.3"]

[project.scripts]
msreview = "morning_star_review.cli:main"

[project.urls]
Homepage = "https://github.com/ThomsenDrake/morning-star-code-reviews"
Issues = "https://github.com/ThomsenDrake/morning-star-code-reviews/issues"

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.25",
  "pytest-timeout>=2.3",
  "ruff>=0.8",
  "mypy>=1.13",
  "types-PyYAML>=6",
  "hypothesis>=6.120",
]

[tool.hatch.version]
path = "src/morning_star_review/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/morning_star_review"]

[tool.hatch.build.targets.sdist]
include = [
  "/src",
  "/tests",
  "/LICENSE",
  "/NOTICE",
  "/README.md",
  "/pyproject.toml",
  "/uv.lock",
]
exclude = ["/.internal"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
extend-exclude = [".internal", "msreview-reports"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "S", "PTH", "N", "C4", "PIE", "RET"]
ignore = [
  "S603", # subprocess with list argv is how we call git/agent; inputs are validated upstream
  "S607", # git is resolved from PATH on purpose
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S108", "S311", "PTH"]
"scripts/**" = ["S101"]

[tool.ruff.lint.isort]
known-first-party = ["morning_star_review"]

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
packages = ["morning_star_review"]
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
show_error_codes = true
plugins = ["pydantic.mypy"]
check_untyped_defs = true

# Equivalent of --strict for the pure packages. Spelled out because a per-module
# `strict = true` is applied to every module by mypy 2.x.
[[tool.mypy.overrides]]
module = [
  "morning_star_review.core.*",
  "morning_star_review.review.*",
  "morning_star_review.diff.*",
]
disallow_any_generics = true
disallow_subclassing_any = true
disallow_untyped_calls = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
disallow_untyped_decorators = true
warn_return_any = true
no_implicit_reexport = true
strict_equality = true
extra_checks = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config", "--import-mode=importlib"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
timeout = 120
markers = [
  "agent: needs the venv-agent environment (mistralai.agents importable)",
  "platform: opt-in; needs a Mistral Workflows key (MSREVIEW_PLATFORM_TESTS=1)",
  "e2e: opt-in live end-to-end runs (MSREVIEW_E2E=1)",
  "canary: opt-in request-shape canary (MSREVIEW_CANARY=1)",
  "slow: slow tests",
]
